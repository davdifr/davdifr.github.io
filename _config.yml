# The Site Configuration

# The site has its own theme: _layouts, _includes, assets/css and assets/js.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: en

# Change to your timezone › https://kevinnovak.github.io/Time-Zone-Picker
timezone: Europe/Rome

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

# The main title. It is appended to every page title (`Post name | Davide Di Francesco`)
# and rendered as the site title in the sidebar, so keep it as the full name.
title: Davide Di Francesco

tagline: Frontend Developer · Angular & TypeScript # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  Personal site of Davide Di Francesco, a frontend developer working with Angular,
  TypeScript and RxJS — notes on front-end architecture and AI-assisted coding.

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
# Required: without it `canonical`, `og:url`, robots.txt and sitemap.xml emit
# relative URLs, which search engines reject.
url: "https://davdifr.com"

# Read by jekyll-seo-tag as the fallback page author: it puts a full-name
# `author` into every post's BlogPosting structured data. Unused by the theme itself.
author:
  name: Davide Di Francesco
  twitter: davdifr # without this, seo-tag derives `twitter:creator` from the name

github:
  username: davdifr # change to your GitHub username

twitter:
  username: davdifr # change to your Twitter username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Davide Di Francesco
  email: davdifr@gmail.com # change to your email address
  links:
    # The first element serves as the copyright owner's link
    - https://twitter.com/davdifr # change to your Twitter homepage
    - https://github.com/davdifr # change to your GitHub homepage
    # Uncomment below to add more social links
    # - https://www.facebook.com/username
    - https://www.linkedin.com/in/davdifr

# Site Verification Settings
webmaster_verifications:
  # Get this from Google Search Console › https://search.google.com/search-console
  # (Add property → davdifr.com → "HTML tag" method → paste the `content` value here)
  google: # fill in your Google verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: G-Q3KNEK30ZF # fill in your Google Analytics ID
  goatcounter:
    id: davdifr # fill in your GoatCounter ID
  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain
  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain
  cloudflare:
    id: # fill in your Cloudflare Web Analytics token
  fathom:
    id: # fill in your Fathom Site ID

# Portrait used in the structured data and as the default social preview.
avatar: /assets/img/avatar.jpg

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
# It can be overridden by a customized `page.image` in front matter.
social_preview_image: /assets/img/avatar.jpg # string, local or CORS resources

comments:
  provider: giscus
  # Giscus options › https://giscus.app
  giscus:
    repo: davdifr/davdifr.github.io # <gh-username>/<repo>
    repo_id: R_kgDOM0nZ5w
    category: General
    category_id: DIC_kwDOM0nZ584Cixdb
    mapping: pathname # optional, default to 'pathname'
    strict: 0 # optional, default to '0'
    input_position: bottom # optional, default to 'bottom'
    lang: en # optional, default to the value of `site.lang`
    reactions_enabled: 1 # optional, default to the value of `1`

# The base URL of your site
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: false

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # Post URLs are linked from outside and key the Giscus discussions: keep them.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "package*.json"
  - node_modules
  - Gemfile
  - Gemfile.lock

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
