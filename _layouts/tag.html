---
layout: default
---
{%- comment -%} Generated by jekyll-archives for every tag. {%- endcomment -%}
<section class="listing">
  <header class="listing__head">
    <p class="label">[ <a href="{{ '/tags/' | relative_url }}">Tags</a> / {{ page.posts | size }} posts ]</p>
    <h1 class="listing__title">{{ page.title }}</h1>
  </header>
  <ol class="rows">
    {%- for post in page.posts %}
      {% include post-row.html post=post full=true %}
    {%- endfor %}
  </ol>
</section>
